{{- if .Values.backend.enabled }}
{{- include "backend.validateMode" . }}
{{- if .Values.backend.mode.deployment }}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-deployment
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: {{ .Values.backend.label }}
  template:
    metadata:
      labels:
        app: {{ .Values.backend.label }}
    spec:
      containers:
        - name: {{ .Values.backend.container.name }}
          image: {{ .Values.backend.container.image.repository }}
          imagePullPolicy: {{ .Values.backend.container.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.container.port }}
          envFrom:
             - configMapRef:
                 name: {{ .Values.backend.config.name }}
             - secretRef:
                 name: {{ .Values.backend.secret.name }}
{{- end }}
{{- end }}