services:
  app:
    build: .
    ports:
      - "3000:3000"
    container_name: backend
    volumes:
      - .:/app
    env_file:
      - .env
    networks:
      - todo-network
    depends_on:
      - db

  db:
    image: postgres:16
    ports:
      - "5432:5432"
    container_name: database
    networks:
      - todo-network
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: todolist
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

networks:
  todo-network:
    external: true
